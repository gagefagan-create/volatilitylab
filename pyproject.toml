[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "volatilitylab"
version = "1.0.0"
description = "Reproducible five-session ETF variance forecast research"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "arch", "matplotlib", "exchange-calendars"]
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
volatilitylab = "volatilitylab.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
